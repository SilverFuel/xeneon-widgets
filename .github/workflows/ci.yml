name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: ./global.json

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Validate Electron dependency compatibility
        run: |
          npm --prefix desktop/electron ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop/electron run check

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Validate JavaScript and native app
        env:
          AUXORA_THEME_ARTIFACT_DIR: ${{ runner.temp }}/auxora-theme-rendered
        run: npm run check

      - name: Preserve rendered theme previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-theme-previews
          path: ${{ runner.temp }}/auxora-theme-rendered/*.png
          if-no-files-found: ignore
          retention-days: 14
