name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Validate
        run: npm run check

      - name: Build installer
        run: npm run installer

      - name: Verify Windows signing policy
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path app/dist -Filter "*.exe" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced."
          }

          $tag = "${{ github.ref_name }}"
          $isPublicStable = "${{ github.ref_type }}" -eq "tag" -and $tag -notmatch "(?i)(alpha|beta|preview|rc|nightly)"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          "SignatureStatus=$($signature.Status)" | Out-File -FilePath app/dist/signature-status.txt -Encoding utf8

          if ($isPublicStable -and $signature.Status -ne "Valid") {
            throw "Public stable releases require a valid Authenticode signature."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: |
            app/dist/*.exe
            app/dist/*.sha256
            app/dist/*.sig
            app/dist/signature-status.txt
            app/dist/README-install.txt

  mac:
    name: macOS package
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Electron host dependencies
        run: npm --prefix desktop/electron ci

      - name: Validate Electron host
        run: npm --prefix desktop/electron run check

      - name: Build macOS package
        run: npm run mac:dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package
          path: |
            desktop/electron/dist/*.dmg
            desktop/electron/dist/*.zip
            desktop/electron/dist/*.yml

  github-release:
    name: Free beta GitHub release
    runs-on: ubuntu-latest
    needs:
      - windows
      - mac
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Create or update free beta release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG_NAME" --jq .id)"
            gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets" --jq '.[].id' | while read asset_id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
            done
            gh release edit "$TAG_NAME" --prerelease --title "Auxora $TAG_NAME Free Public Beta" --notes-file docs/release/FREE-BETA-RELEASE-NOTES.md
            gh release upload "$TAG_NAME" release-assets/**/*
          else
            gh release create "$TAG_NAME" release-assets/**/* --prerelease --title "Auxora $TAG_NAME Free Public Beta" --notes-file docs/release/FREE-BETA-RELEASE-NOTES.md
          fi
