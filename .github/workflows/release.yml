name: Windows Beta Candidate

on:
  push:
    tags:
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful tag-build workflow run containing the exact tested candidate"
        required: true
        type: string
      tag:
        description: "Immutable beta tag, for example v0.3.0-beta.1"
        required: true
        type: string
      lifecycle_receipt_base64:
        description: "Base64 JSON receipt from the disposable Windows VM lifecycle test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows-candidate:
    if: github.event_name == 'push'
    name: Build immutable Windows candidate
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out immutable tag commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Validate synchronized beta version and tag
        id: version
        shell: pwsh
        run: |
          $version = (& ./scripts/Test-ReleaseVersion.ps1 -ExpectedTag "${{ github.ref_name }}").Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Validate source and native host
        run: npm run check

      - name: Build exact Windows installer
        run: npm run installer

      - name: Stage and verify exact allowlisted candidate
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installers = @(Get-ChildItem -LiteralPath app/dist -Filter "Auxora-Setup-$version-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer for $version; found $($installers.Count)."
          }

          $candidateRoot = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination $candidateRoot
          Copy-Item -LiteralPath "$($installers[0].FullName).sha256" -Destination $candidateRoot
          Copy-Item -LiteralPath docs/release/WINDOWS-INSTALL-UNINSTALL.md -Destination $candidateRoot
          Copy-Item -LiteralPath docs/release/FREE-BETA-RELEASE-NOTES.md -Destination $candidateRoot

          & ./scripts/New-ReleaseManifest.ps1 `
            -InstallerPath (Join-Path $candidateRoot $installers[0].Name) `
            -Tag "${{ github.ref_name }}" `
            -Version $version `
            -CommitSha "${{ github.sha }}" `
            -InstallNotesPath (Join-Path $candidateRoot "WINDOWS-INSTALL-UNINSTALL.md") `
            -ReleaseNotesPath (Join-Path $candidateRoot "FREE-BETA-RELEASE-NOTES.md") `
            -OutputPath (Join-Path $candidateRoot "release-manifest.json")

          & ./scripts/Test-ReleaseArtifact.ps1 -InstallerPath (Join-Path $candidateRoot $installers[0].Name) -ExpectedVersion $version
          & ./scripts/Test-ReleaseManifest.ps1 -ReleaseAssetsPath $candidateRoot -ExpectedTag "${{ github.ref_name }}" -ExpectedCommitSha "${{ github.sha }}"

      - name: Upload immutable Windows candidate for VM testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auxora-windows-candidate-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  publish-tested-candidate:
    if: github.event_name == 'workflow_dispatch'
    name: Publish receipt-bound Windows beta
    runs-on: windows-latest
    environment: beta-publication
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out requested immutable tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify candidate run and download exact artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$') {
            throw "candidate_run_id must be a numeric GitHub Actions run id."
          }
          $tagSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($run.event -cne "push" -or $run.conclusion -cne "success") {
            throw "Candidate run must be a successful tag-push build."
          }
          if ([string]$run.head_sha -cne $tagSha) {
            throw "Candidate workflow SHA does not match the requested immutable tag."
          }
          if ([string]$run.head_branch -cne $env:RELEASE_TAG) {
            throw "Candidate workflow was not triggered by the requested tag."
          }

          $artifactName = "auxora-windows-candidate-$tagSha"
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $artifactName --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to download exact candidate artifact '$artifactName'." }
          "tag_sha=$tagSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify manifest and disposable-VM lifecycle receipt
        shell: pwsh
        env:
          LIFECYCLE_RECEIPT_BASE64: ${{ inputs.lifecycle_receipt_base64 }}
        run: |
          $version = (& ./scripts/Test-ReleaseVersion.ps1 -ExpectedTag "${{ inputs.tag }}").Trim()
          & ./scripts/Test-ReleaseManifest.ps1 -ReleaseAssetsPath release-assets -ExpectedTag "${{ inputs.tag }}" -ExpectedCommitSha $env:tag_sha

          try {
            $receiptBytes = [Convert]::FromBase64String($env:LIFECYCLE_RECEIPT_BASE64)
          } catch {
            throw "lifecycle_receipt_base64 is not valid base64."
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD "lifecycle-receipt.json"), $receiptBytes)
          & ./scripts/Test-BetaLifecycleReceipt.ps1 -ReceiptPath lifecycle-receipt.json -ReleaseAssetsPath release-assets

      - name: Publish exact assets without replacing existing bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null) {
            throw "Release $env:RELEASE_TAG already exists. Published bytes are immutable; create a new version/tag."
          }

          $manifest = Get-Content -LiteralPath release-assets/release-manifest.json -Raw | ConvertFrom-Json
          $root = (Resolve-Path release-assets).Path
          $assets = @(
            (Join-Path $root ([string]$manifest.installer.fileName)),
            (Join-Path $root ([string]$manifest.installer.sha256FileName)),
            (Join-Path $root ([string]$manifest.installNotesFileName)),
            (Join-Path $root ([string]$manifest.releaseNotesFileName)),
            (Join-Path $root "release-manifest.json")
          )
          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --prerelease `
            --title "Auxora $($manifest.version) Free Public Beta" `
            --notes-file (Join-Path $root ([string]$manifest.releaseNotesFileName))
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
